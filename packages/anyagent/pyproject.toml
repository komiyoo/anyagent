[project]
name = "anyagent"
version = "0.4.21"
description = "anyagent SDK (agent runtime + protocol + gateway + skills + tool runtime)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "jsonschema>=4.23",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "fastapi>=0.116",
  "openai>=2.24.0",
  "mcp>=1.0.0",
  "uvicorn>=0.35",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "greenlet>=3.0",
]
mysql = [
  "asyncmy>=0.2",
  "sqlalchemy>=2.0",
  "greenlet>=3.0",
]
redis = [
  "redis>=5.0",
]
local = [
  "aiosqlite>=0.20",
  "sqlalchemy>=2.0",
  "greenlet>=3.0",
]
s3 = [
  "minio>=7.2.8",
]
infisical = [
  "infisicalsdk>=1.0.16",
]
external-storage = [
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "asyncmy>=0.2",
  "sqlalchemy>=2.0",
  "greenlet>=3.0",
  "redis>=5.0",
  "minio>=7.2.8",
]

[project.scripts]
anyagent = "anyagent.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
]

# 默认走阿里云 PyPI 镜像：uv.lock 会把下载 URL 锁到镜像域名，
# 否则 Yunxiao CI（北京 runner）按锁文件直连 files.pythonhosted.org 只有 KB/s。
[[tool.uv.index]]
name = "aliyun-mirror"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anyagent"]
