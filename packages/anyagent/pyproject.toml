[project]
name = "anyagent"
version = "0.1.0"
description = "AnyAgent SDK (agent runtime + protocol + gateway + skills + tool runtime)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "jsonschema>=4.23",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "openai>=2.24.0",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anyagent"]
