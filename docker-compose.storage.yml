name: anyagent-storage

services:
  postgres:
    image: postgres:18
    container_name: anyagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anyagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anyagent}
      POSTGRES_DB: ${POSTGRES_DB:-anyagent}
    ports:
      - "${POSTGRES_PORT:-35432}:5432"
    volumes:
      - anyagent-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: anyagent-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
    ports:
      - "${REDIS_PORT:-35433}:6379"
    volumes:
      - anyagent-redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

volumes:
  anyagent-postgres-data:
  anyagent-redis-data:
