[project]
name = "agent-api"
version = "0.1.0"
description = "AnyAgent Agent API (OpenAI Responses-compatible proxy)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "redis>=5.0",
  "uvicorn[standard]>=0.30",
  "anyagent",
]

[project.scripts]
agent-api = "anyagent_agent_api.main:main"
agent-api-migrate = "anyagent_agent_api.storage.migrate:main"
agent-api-retention = "anyagent_agent_api.storage.retention:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anyagent_agent_api"]

[tool.uv.sources]
anyagent = { path = "../../packages/anyagent" }
