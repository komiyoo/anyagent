[project]
name = "tool-runtime"
version = "0.1.0"
description = "AnyAgent Tool Runtime (router + executors, v0 single-process)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "uvicorn[standard]>=0.30",
  "anyagent",
]

[project.scripts]
tool-runtime = "anyagent_tool_runtime.main:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anyagent_tool_runtime"]

[tool.uv.sources]
anyagent = { path = "../../packages/anyagent", editable = true }
