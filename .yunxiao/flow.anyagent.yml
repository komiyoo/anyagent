sources:
  main_repo:
    type: codeup
    name: anyagent
    endpoint: https://codeup.aliyun.com/63d476f8d14a7f379aa798da/anyagent.git
    branch: main
    triggerEvents:
      - push
    branchesFilter: ^main$
    certificate:
      type: serviceConnection
      serviceConnection: dtrcgsysymyh6jgt

defaultWorkspace: main_repo

stages:
  build_stage:
    name: 构建阶段
    jobs:
      build_job:
        name: 构建并发布 anyagent SDK
        runsOn:
          group: public/cn-beijing
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
        steps:
          setup_python_step:
            name: 安装 Python
            step: SetupPython
            with:
              pythonVersion: "3.12.13"
          notify_step:
            name: 构建前飞书通知
            step: Command
            with:
              run: python3 scripts/notify_release_start.py --project anyagent
          command_step:
            name: 测试并构建 SDK
            step: Command
            with:
              run: |
                set -eu
                export PIP_DISABLE_PIP_VERSION_CHECK=1
                export PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/
                export PIP_TRUSTED_HOST=mirrors.aliyun.com
                export PIP_CACHE_DIR="${PIP_CACHE_DIR:-$PWD/.cache/pip}"
                export UV_CACHE_DIR="${UV_CACHE_DIR:-$PWD/.cache/uv}"
                mkdir -p "$PIP_CACHE_DIR" "$UV_CACHE_DIR"
                if command -v yum >/dev/null 2>&1; then
                  yum install -y libffi libffi-devel >/dev/null 2>&1 || true
                fi
                libffi_path="$(ldconfig -p 2>/dev/null | awk '/libffi.so/{print $NF; exit}')"
                if [ -n "$libffi_path" ] && [ ! -e /usr/lib64/libffi.so.7 ]; then
                  ln -s "$libffi_path" /usr/lib64/libffi.so.7 || true
                fi
                if ! python -c "import ctypes" >/dev/null 2>&1; then
                  echo "Python ctypes is unavailable after libffi setup; check libffi runtime." >&2
                  exit 1
                fi
                python -m pip install --upgrade build hatchling pytest twine uv
                bash scripts/ci/run_docs_guardrails.sh
                bash scripts/ci/run_pytest_regressions.sh
                bash scripts/ci/run_offline_smokes.sh
                rm -rf packages/anyagent/dist
                python -m build --no-isolation packages/anyagent
                python -m twine check packages/anyagent/dist/*
          upload_step:
            step: ArtifactUpload
            name: 上传 SDK 发行包
            with:
              uploadType: flowPublic
              artifact: anyagent-sdk-dist
              filePath:
                - packages/anyagent/dist/
                - docs/release-checklist.md
                - .yunxiao/flow.anyagent.yml
              includePathInArtifact: false
          sync_github_step:
            name: 同步对应分支到 GitHub
            step: Command
            with:
              run: bash scripts/mirror-codeup-to-github.sh
          publish_step:
            name: 发布到云效 PyPI
            step: Command
            with:
              run: bash scripts/publish-yunxiao-pypi.sh
