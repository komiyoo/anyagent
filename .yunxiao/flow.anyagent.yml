# Retired. SDK build and Yunxiao Packages publish run in
# .github/workflows/ci.yml on push to GitHub main (Lyrik-AI/AnyAgent).
# This pipeline must not trigger on Codeup push.
sources:
  main_repo:
    type: codeup
    name: anyagent
    endpoint: https://codeup.aliyun.com/63d476f8d14a7f379aa798da/anyagent.git
    branch: __retired__
    triggerEvents: []
    branchesFilter: ^__retired__$
    certificate:
      type: serviceConnection
      serviceConnection: dtrcgsysymyh6jgt

defaultWorkspace: main_repo

stages:
  retired_stage:
    name: 已停用
    jobs:
      retired_job:
        name: 发布已迁到 GitHub Actions
        runsOn:
          group: public/cn-hongkong
          container: registry.cn-beijing.aliyuncs.com/lyriktrip/python:anyagent-ci-py312-amd64
        steps:
          note_step:
            name: 说明
            step: Command
            with:
              run: |
                echo "anyagent SDK publish moved to GitHub Actions on Lyrik-AI/AnyAgent."
                echo "This Flow pipeline no longer builds or publishes."
