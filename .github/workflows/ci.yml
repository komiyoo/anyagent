name: anyagent-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync dependencies
        run: |
          uv sync --project packages/anyagent --frozen

      - name: Docs Guardrails
        run: bash scripts/ci/run_docs_guardrails.sh

      - name: Protocol Schema Breaking Diff
        run: bash scripts/ci/run_protocol_schema_diff.sh

      - name: Pytest Regressions
        run: bash scripts/ci/run_pytest_regressions.sh

      - name: Offline Smokes
        run: bash scripts/ci/run_offline_smokes.sh

  live-storage-matrix:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANYAGENT_TEST_POSTGRES_DSN: ${{ secrets.ANYAGENT_TEST_POSTGRES_DSN }}
      ANYAGENT_TEST_REDIS_DSN: ${{ secrets.ANYAGENT_TEST_REDIS_DSN }}
      ANYAGENT_TEST_MYSQL_DSN: ${{ secrets.ANYAGENT_TEST_MYSQL_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync dependencies
        run: |
          uv sync --project packages/anyagent --frozen

      - name: Live Storage Matrix
        run: bash scripts/ci/run_live_storage_matrix.sh

  publish-packages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: offline-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: anyagent-publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_TRUSTED_HOST: pypi.org
      ANYAGENT_PUBLISH_REQUIRED: "1"
      TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
      FEISHU_RELEASE_WEBHOOK_URL: ${{ secrets.FEISHU_RELEASE_WEBHOOK_URL }}
      FEISHU_RELEASE_WEBHOOK_SECRET: ${{ secrets.FEISHU_RELEASE_WEBHOOK_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Notify release start
        run: |
          python3 scripts/notify_release_start.py \
            --project anyagent \
            --branch "${{ github.ref_name }}" \
            --previous-ref "${{ github.event.before }}" \
            --target-ref "${{ github.sha }}"

      - name: Build Python SDK
        run: bash scripts/ci/build_release_artifacts.sh

      - name: Publish Python SDK to Yunxiao Packages
        run: bash scripts/publish-yunxiao-pypi.sh
